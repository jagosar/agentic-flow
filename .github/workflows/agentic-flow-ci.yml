# Tests del propio flow: guardarraíles, comandos del pipeline, lógica del workflow (agentes simulados),
# definiciones de agentes y deriva de la documentación. Solo corre en el repo plantilla, no en los
# proyectos creados a partir de él.
#
# Endurecido: actions fijadas por SHA (la etiqueta va en el comentario), permisos mínimos, sin credenciales
# persistidas en el checkout, sin instalar nada de terceros, concurrencia y timeout acotados.
name: agentic-flow-ci
on:
  push:
    paths: [".claude/**", ".claude-plugin/**", "plugin/**", "docs/**", "*.md", ".github/workflows/agentic-flow-ci.yml"]
  pull_request:
    paths: [".claude/**", ".claude-plugin/**", "plugin/**", "docs/**", "*.md", ".github/workflows/agentic-flow-ci.yml"]

permissions:
  contents: read

concurrency:
  group: agentic-flow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'jagosar/agentic-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: git config --global init.defaultBranch main
      - name: Escenarios del workflow (agentes simulados)
        run: node .claude/bin/test_workflow.mjs
      - name: Guardarraíles, comandos y definiciones
        run: python -m unittest discover -s .claude/bin -p "test_*.py" -v

  plugin:
    if: github.repository == 'jagosar/agentic-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Versión exacta y sin scripts de instalación: el binario nativo viene en su propio paquete y se usa tal cual.
      - name: Claude Code (solo para validar el plugin, sin credenciales)
        run: npm install --prefix "$RUNNER_TEMP/cc" --no-save --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.302
      - name: Validar plugin y marketplace
        run: '"$RUNNER_TEMP/cc/node_modules/@anthropic-ai/claude-code-linux-x64/claude" plugin validate --strict .'
